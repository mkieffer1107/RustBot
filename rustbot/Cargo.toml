[workspace]
members = ["crates/pyrt", "crates/bot", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
fancy-regex = "0.16"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Runtime-optimized execution for parity iteration without LTO.
# Performance acceptance still uses the normal release profile.
[profile.parity]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 16
debug = false

[profile.parity.package.pyrt]
opt-level = 3

[profile.parity.package.bot]
opt-level = 0
